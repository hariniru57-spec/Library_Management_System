{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Library Management System{% endblock %}</title>
<link rel="stylesheet" href="{% static 'library_app/css/style.css' %}">
</head>
<body>
<nav class="navbar">
  <a class="brand" href="{% url 'home' %}">📚 LibraryHub</a>
  <div class="nav-links">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'book_list' %}">Books</a>
    <a class="btn small" href="{% url 'add_book' %}">+ Add Book</a>
  </div>
</nav>
<main class="container">
{% if messages %}
  {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
{% endif %}
{% block content %}{% endblock %}
</main>
<footer>Library Management System • Django CRUD Project</footer>
</body>
</html>
