{% extends "library_app/base.html" %}
{% block title %}Delete Book | LibraryHub{% endblock %}
{% block content %}
<div class="form-card">
<h1>Delete Book?</h1>
<p>Are you sure you want to delete <strong>{{ book.title }}</strong>?</p>
<form method="post">{% csrf_token %}<button class="btn danger-btn" type="submit">Yes, Delete</button><a class="btn outline" href="{% url 'book_list' %}">Cancel</a></form>
</div>
{% endblock %}
